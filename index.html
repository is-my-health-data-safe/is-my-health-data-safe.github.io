<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>당신의 의료정보는 안전한가요?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column. Night-hospital backdrop, paper cards for records,
     friendly blue only inside the app, red only for verdicts.
     Voices: narration in batang serif (people), system text in gothic/mono (machines). */
  --night:#0e1521;
  --night-2:#172131;
  --rule:#2b384b;
  --paper:#eef0ec;
  --ink:#131b26;
  --mute:#8d9aad;
  --alarm:#ff4f3f;
  --app:#2f6bff;
  --amber:#f6b345;
  --f-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-narr:'Gowun Batang','AppleMyungjo','Batang',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--night);color:var(--paper);
  font-family:var(--f-ui);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.stage{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--mute)}
.stage.is-title .hud{display:none}
.hud-ch{font-weight:600;color:var(--paper);white-space:nowrap}
.pips{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex:1}
.pips li{height:3px;flex:1;background:var(--rule);border-radius:2px}
.pips li.on{background:var(--paper)}
.hud-count{white-space:nowrap;font-family:var(--f-mono)}
.hud-count b{color:var(--amber);font-weight:500}
.hud-count.leak b{color:var(--alarm)}

/* Scene */
.scene{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 48px;display:flex;flex-direction:column;gap:16px}
/* children must keep their full height; the scene scrolls instead of squeezing them */
.scene>*{flex-shrink:0}
.enter{animation:enter .4s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.chip{align-self:flex-start;font-family:var(--f-mono);font-size:12px;letter-spacing:.02em;color:var(--mute);border:1px solid var(--rule);border-radius:4px;padding:3px 8px}
.narr{font-family:var(--f-narr);font-size:18px;line-height:1.75;margin:0}
.narr strong{font-weight:700}
.h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.note{font-size:13px;color:var(--mute);margin:0}
.fact{border-left:3px solid var(--alarm);padding:2px 0 2px 12px;margin:0;font-size:15px}
.fact b{font-weight:600}

.row{display:flex;flex-direction:column;gap:8px}
.btn{min-height:52px;border-radius:10px;border:1px solid var(--rule);background:var(--night-2);padding:12px 16px;font-weight:600;font-size:16px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn.small{min-height:40px;font-size:14px;padding:8px 12px}
.btn[disabled]{opacity:.5;cursor:default}

/* Title */
.title{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--mute);margin:0}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,11.5vw,50px);line-height:1.12;margin:0;text-wrap:balance}
.title h1 em{font-style:normal;color:var(--amber)}
.record{position:relative;background:var(--paper);color:var(--ink);border-radius:4px;padding:14px 16px;transform:rotate(-2.5deg);margin:8px 34px 4px 4px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.record-head{display:flex;justify-content:space-between;font-weight:600;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
.record-head span:last-child{font-family:var(--f-mono);font-weight:400}
.record dl{margin:0;display:grid;grid-template-columns:64px 1fr;gap:5px 8px}
.record dt{color:#5a6676}
.record dd{margin:0}
.bar{display:inline-block;height:11px;background:var(--ink);border-radius:1px;vertical-align:middle}
.tag{position:absolute;right:-30px;top:26px;background:var(--amber);color:var(--ink);font-family:var(--f-display);font-size:22px;line-height:1;padding:10px 12px 8px 20px;transform:rotate(11deg);clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--paper)}
.lede{font-family:var(--f-narr);font-size:17px;line-height:1.75;margin:0}
.lede em{font-style:normal;font-weight:700;color:var(--alarm)}

.who{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:64px;border-radius:12px;border:1px solid var(--rule);background:var(--night-2);padding:12px 16px}
.who b{font-size:17px;font-weight:600}
.who span{font-size:13px;color:var(--mute)}
.who:active{transform:translateY(1px)}

/* Lock screen */
.lock{background:linear-gradient(180deg,#1b2a40,#101927);border:1px solid var(--rule);border-radius:22px;padding:22px 14px 16px;display:flex;flex-direction:column;gap:10px}
.lock-time{font-family:var(--f-mono);font-size:52px;line-height:1;text-align:center;font-weight:400;letter-spacing:-.02em}
.lock-date{text-align:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.lock-list{display:flex;flex-direction:column;gap:10px}
.notif{background:rgba(238,240,236,.1);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.55}
.notif-head{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:2px;font-family:var(--f-mono)}
.stamp{align-self:flex-end;margin:-4px 10px 0 0;display:flex;flex-direction:column;align-items:center;color:var(--alarm);border:4px solid var(--alarm);border-radius:8px;padding:6px 18px 0;font-family:var(--f-display);font-size:68px;line-height:1.05;transform:rotate(-8deg)}
.stamp small{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em}
.stamp.enter{animation:slam .38s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{from{opacity:0;transform:rotate(-8deg) scale(2.6)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.dead{font-family:var(--f-mono);font-size:13px;color:var(--alarm);border:1px dashed var(--alarm);border-radius:8px;padding:10px 12px;margin:0}

.trace{border-left:3px solid var(--amber);padding:2px 0 2px 12px;font-size:15px;line-height:1.6}
.trace small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--mute);word-spacing:-.25em}
.trace b{font-weight:600}

/* Rewind */
.rewind{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:300px}
.rewind-word{font-family:var(--f-display);font-size:64px;line-height:1;margin:0}
.rewind-tick{font-family:var(--f-mono);font-size:20px;color:var(--amber);margin:0}
.tape{height:44px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:repeating-linear-gradient(90deg,var(--rule) 0 2px,transparent 2px 18px)}
.tape.run{animation:tape .5s linear infinite}
@keyframes tape{to{background-position:36px 0}}

/* App */
.app{background:#fff;color:var(--ink);border-radius:18px;overflow:hidden}
.app-bar{background:var(--app);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline}
.app-bar b{font-size:18px;font-weight:600}
.app-bar span{font-size:12px;opacity:.85}
.app-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.queue{display:flex;justify-content:space-between;font-size:13px;background:#eef3ff;border-radius:8px;padding:8px 10px}
.queue b{color:var(--app);font-weight:600}
.app h3{margin:0;font-size:16px;font-weight:600}
.terms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.terms li{border-bottom:1px solid #e3e7ee;padding:8px 0}
.term-line{display:flex;align-items:flex-start;gap:8px}
.term-line input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--app);flex:none}
.term-line label{flex:1;font-size:14px;line-height:1.45}
.term-line label i{font-style:normal;font-weight:600;color:var(--app)}
.term-more{flex:none;border:0;background:none;color:#7c8798;font-size:12px;text-decoration:underline;padding:2px 0 2px 6px;min-height:28px}
.small-print{font-size:11px;line-height:1.5;color:#6b7686;background:#f4f6f9;border-radius:6px;padding:8px;margin:6px 0 0 28px;max-height:76px;overflow-y:auto}
.small-print mark{background:none;color:inherit}
.small-print.lit mark{background:#ffd9d4;color:#b3261a}
.btn-app{min-height:54px;border:0;border-radius:12px;background:var(--app);color:#fff;font-weight:600;font-size:17px}
.btn-link{border:0;background:none;color:#7c8798;font-size:13px;text-decoration:underline;min-height:36px}
.app-err{font-size:13px;color:#b3261a;margin:0}
.pressure{font-size:12px;color:#b3261a;margin:0;min-height:18px;text-align:center}

/* Flow */
.flow{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:12px;padding:14px 12px}
.flow-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.flow-chips span{background:var(--paper);color:var(--ink);font-size:13px;border-radius:4px;padding:3px 8px}
.flow-arrow{font-family:var(--f-mono);color:var(--amber);line-height:1}
.flow-gate{font-family:var(--f-display);font-size:22px;border:2px solid var(--amber);color:var(--amber);border-radius:6px;padding:4px 14px 2px}
.flow-out{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.flow-out span{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:3px 8px}
.stat{font-family:var(--f-mono);font-size:14px;color:var(--amber);margin:0}

/* Street */
.street{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:2px solid var(--rule);padding:0 2px}
.bld{--win:#24344a;flex:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:0;border:1px solid var(--rule);border-bottom:0;border-radius:6px 6px 0 0;
  background-color:var(--night-2);
  background-image:repeating-linear-gradient(0deg,transparent 0 14px,var(--night-2) 14px 24px),repeating-linear-gradient(90deg,var(--win) 0 12px,var(--night-2) 12px 20px);
  background-position:8px 44px;background-origin:content-box}
.bld:nth-child(1){height:150px}
.bld:nth-child(2){height:196px}
.bld:nth-child(3){height:172px}
.bld-sign{background:var(--night);border-bottom:1px solid var(--rule);font-size:12px;font-weight:600;line-height:1.3;padding:7px 4px;border-radius:5px 5px 0 0;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center}
.bld.seen{--win:var(--amber)}
.bld[aria-pressed="true"]{border-color:var(--paper)}
.bld[aria-pressed="true"] .bld-sign{background:var(--paper);color:var(--ink)}
.panel{background:var(--night-2);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25;margin:0}
.panel p{margin:0;font-size:15px}
.eg{font-family:var(--f-mono);font-size:11px;color:var(--mute);margin:0}

.ads{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.ads li{background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.4}
.ads small{display:block;font-family:var(--f-mono);font-size:11px;color:#6b7686}

.mix{display:flex;flex-wrap:wrap;gap:6px}
.mix button{min-height:40px;border:1px solid var(--rule);background:var(--night);border-radius:20px;padding:6px 14px;font-size:14px}
.mix button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grade{display:flex;align-items:center;gap:14px}
.grade-letter{font-family:var(--f-display);font-size:60px;line-height:1;width:64px;text-align:center;border:3px solid currentColor;border-radius:8px;padding-top:6px}
.grade-letter[data-g="A"]{color:var(--paper)}
.grade-letter[data-g="B"],.grade-letter[data-g="C"]{color:var(--amber)}
.grade-letter[data-g="D"]{color:var(--alarm)}
.grade dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;flex:1}
.grade dt{color:var(--mute)}
.grade dd{margin:0;font-weight:500}
.grade dd.bad{color:var(--alarm)}

.optout{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--night);border:1px solid var(--rule);border-radius:10px;padding:12px}
.optout span{font-size:15px;font-weight:500}
.switch{flex:none;width:58px;height:34px;border-radius:17px;border:0;background:var(--rule);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--paper);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--app)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.switch.snap{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.pool{display:flex;flex-direction:column;gap:8px;background:var(--night);border:1px solid var(--rule);border-radius:10px;padding:12px}
.pool-n{font-size:14px;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.pool-n b{font-family:var(--f-mono);font-weight:500;font-size:20px;color:var(--amber)}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber);transition:width .4s}
.ref-line{font-size:12px;color:var(--mute);margin:0}

.stage{position:relative}
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;margin-left:6px;vertical-align:middle;border-radius:50%;border:1.5px solid currentColor;background:none;padding:0;font:italic 600 14px/1 Georgia,'Times New Roman',serif;opacity:.75}
.info::after{content:"";position:absolute;inset:-10px}
.info[aria-expanded="true"]{opacity:1;background:var(--amber);border-color:var(--amber);color:var(--ink)}
.tip{position:absolute;left:20px;right:20px;z-index:5;background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.tip p{margin:0 0 6px}
.tip p:last-child{margin:0}
.tip .eg-t{color:#5a6676}
.flow{position:relative}
.flow>.info{position:absolute;top:8px;right:8px}
.flow-lab{font-family:var(--f-mono);font-size:11px;color:var(--mute);word-spacing:-.25em}
.flow .flow-out,.flow .flow-chips{padding:0 26px}

.dock{display:flex;justify-content:space-around;gap:8px;background:var(--night-2);border:1px solid var(--rule);border-radius:18px;padding:14px 8px 10px}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px;min-width:84px;font-size:12px;font-weight:500;color:var(--mute)}
.icon i{position:relative;width:60px;height:60px;border-radius:16px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.icon svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="true"]{color:var(--paper)}
.icon[aria-pressed="true"] i{outline:2px solid var(--paper);outline-offset:3px}
.icon.seen i::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid var(--night-2)}
.app .app-bar{background:var(--brand,var(--app))}
.app .btn-app{background:var(--brand,var(--app))}
.app-sub{font-size:13px;color:#6b7686;margin:-6px 0 0}
.stats{display:flex;gap:6px}
.stats span{flex:1;background:#f0f3f8;border-radius:8px;padding:6px 4px;text-align:center;font-size:12px;line-height:1.3;color:#5a6676}
.stats b{display:block;font-size:17px;font-weight:600;color:var(--brand)}
.app .ads li{background:#f4f6f9}
.app .ads small{font-family:var(--f-ui);font-weight:600;color:var(--brand);word-spacing:0}
.app .mix button{background:#fff;color:var(--ink);border-color:#c9cfd8}
.app .mix button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.app .grade dt{color:#6b7686}
.app .grade-letter[data-g="A"]{color:var(--ink)}
.app .grade-letter[data-g="B"],.app .grade-letter[data-g="C"]{color:#b97a00}
.app .grade-letter[data-g="D"],.app .grade dd.bad{color:#d0321f}
.card{background:#f4f6f9;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:14px;font-weight:600}
.app .pool-n b{color:var(--brand)}
.app .meter{background:#dfe3ea}
.app .meter i{background:var(--brand)}
.below{display:flex;flex-direction:column;gap:12px}
.lead{font-size:15px;line-height:1.6;margin:0}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.recs li{padding-left:20px;position:relative}
.recs li::before{content:"";position:absolute;left:2px;top:7px;width:10px;height:6px;border-left:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg)}
.recs li.none{padding-left:0;color:#6b7686}
.recs li.none::before{display:none}
.app .grade dl{align-items:center}
.app .grade dd{font-size:16px;font-weight:600}

/* Hack */
.alert{border:2px solid var(--alarm);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.55}
.alert-head{font-family:var(--f-mono);font-size:12px;color:var(--alarm);display:flex;justify-content:space-between;margin-bottom:4px}
.leaks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.leaks li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--night-2);border:1px solid var(--rule);border-radius:10px;padding:8px 10px 8px 14px;min-height:56px}
.leaks span{font-size:15px}
.leaks .res{font-family:var(--f-mono);font-size:13px;text-align:right}
.leaks .ok{color:#7fd4a3}
.leaks .no{color:var(--alarm)}
.leaks li.shake{animation:shake .3s}

.kin{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kin li{display:grid;grid-template-columns:1fr 84px 64px;align-items:center;gap:10px;font-size:14px}
.kin b{font-family:var(--f-mono);font-weight:500;text-align:right;color:var(--amber);font-variant-numeric:tabular-nums}
.kin li.src b{color:var(--alarm)}
.kin li.src .meter i{background:var(--alarm)}

/* Verdict */
.q{background:var(--paper);color:var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q-n{font-family:var(--f-mono);font-size:12px;color:#5a6676;margin:0}
.q-t{font-family:var(--f-narr);font-weight:700;font-size:19px;line-height:1.5;margin:0}
.q .row{flex-direction:row}
.q .btn{flex:1;background:#fff;color:var(--ink);border-color:#c9cfd8}
.q .btn.picked,.q .btn.picked[disabled]{background:var(--ink);color:var(--paper);border-color:var(--ink);opacity:1}
/* mono face has a wide space; tighten it where the text is mostly Korean */
.chip,.eyebrow,.hud-count,.notif-head,.dead,.eg,.stat,.flow-arrow,.alert-head,.leaks .res,.ads small,.q-n,.q-a .lab,.q-a .ref{word-spacing:-.25em}
.q-a{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.q-a p{margin:0}
.q-a .gov{font-size:16px;font-weight:600;color:#b3261a}
.q-a .lab{font-family:var(--f-mono);font-size:11px;color:#5a6676;display:block}
.q-a .ref{font-family:var(--f-mono);font-size:11px;color:#8792a2}

/* End */

  function notif(app, when, text){
    return h('div', {class:'notif'}, h('div', {class:'notif-head'}, h('span', null, app), h('span', null, when)), text);
  }
  function trace(label, html){
    return h('div', {class:'trace'}, h('small', null, label), h('span', {html:html}));
  }
  function sCh1(r){
    var c = who().ch1;
    hud(1, who().hud1);
    add(r, chip(c.chip));
    add(r, narr(c.narr));
    add(r, h('div', {class:'lock'}, h('div', {class:'lock-time'}, c.time), h('div', {class:'lock-date'}, c.date),
      h('div', {class:'lock-list'}, notif(c.notif[0], c.notif[1], c.notif[2]))));
    var i = 0;
    function nextStep(){
      if (i >= c.steps.length){ finish(); return; }
      var st = c.steps[i];
      step(r, st.btn, function(){
        add(r, trace(st.label, st.html));
        i++;
        if (st.stamp) later(function(){ add(r, h('div', {class:'stamp'}, h('small', null, st.stamp), 'D')); nextStep(); }, 500);
        else nextStep();
      });
    }
    function finish(){
      add(r, narr(c.last));
      var msg = h('p', {class:'dead', role:'status'});
      var done = false;
      function dead(t){
        msg.textContent = t;
        if (!msg.isConnected) add(r, msg);
        if (done) return; done = true;
        later(function(){ step(r, c.next, next); }, 700);
      }
      add(r, h('div', {class:'row'}, c.deads.map(function(d){
        return h('button', {class:'btn', type:'button', onclick:function(){ dead(d[1]); }}, d[0]);
      })));
    }
    nextStep();
  }

  /* ---------- 되감기 ---------- */
  function sRewind(r){
    var c = who().rewind;
    hud(1, '되감기');
    var labels = c.labels;
    var tick = h('p', {class:'rewind-tick', 'aria-live':'polite'}, labels[0]);
    var tape = h('div', {class:'tape run', 'aria-hidden':'true'});
    var box = h('div', {class:'rewind'}, h('p', {class:'rewind-word'}, '되감기'), tape, tick);
    r.append(box);
    function end(){
      tick.textContent = labels[labels.length - 1];
      tape.classList.remove('run');
      add(box, narr(c.narr));
      step(box, c.btn, next);
    }
    if (reduce) { end(); return; }
    var n = 0;
    var iv = setInterval(function(){
      n++; tick.textContent = labels[n];
      if (n >= labels.length - 1){ clearInterval(iv); end(); }
    }, 340);
    timers.push(iv);
  }

  /* ---------- 2. 동의 ---------- */
  function sCh2(r){
    var c = who().ch2;
    hud(2, '2장 · 동의');
    add(r, chip(c.chip));
    add(r, narr(c.narr));
    step(r, c.install, function(){
      var n = 0, t0 = performance.now();
      var bold = h('b', null, c.bold0);
      var pressure = h('p', {class:'pressure', role:'status'});
      var err = h('p', {class:'app-err', role:'alert'});
      var items = [
        { id:'c1', tag:'[필수]', label:'서비스 이용약관 및 개인정보 수집 동의', small:c.term1 },
        { id:'c2', tag:'[선택]', label:'건강정보 맞춤 혜택 및 연계 서비스 제공', small:TERM2 },
        { id:'c3', tag:c.tag3, label:c.label3, small:c.term3 }
      ];
      var ul = h('ul', {class:'terms'});
      items.forEach(function(it){
        var sp = h('div', {class:'small-print', html:it.small, hidden:true, tabindex:'0'});
        var cb = h('input', {type:'checkbox', id:it.id, checked:true});
        cb.checked = true;
        ul.append(h('li', null,
          h('div', {class:'term-line'}, cb,
            h('label', {for:it.id, html:'<i>' + it.tag + '</i> ' + it.label}),
            h('button', {class:'term-more', type:'button', 'aria-label':it.label + ' 내용 보기', onclick:function(){ sp.hidden = !sp.hidden; S.readTerms = true; }}, '보기')
          ), sp));
      });
      function submit(all){
        var cs = items.map(function(it){ return document.getElementById(it.id); });
        if (all) cs.forEach(function(x){ x.checked = true; });
        if (!cs[0].checked){ err.textContent = c.err; return; }
        S.consentMs = performance.now() - t0;
        S.optional = (cs[1].checked ? 1 : 0) + (cs[2].checked ? 1 : 0);
        S.agreedAll = S.optional === 2;
        S.doneChip = c.done(n, cs[2].checked);
        next();
      }
      add(r, h('div', {class:'app'},
        h('div', {class:'app-bar'}, h('b', null, c.app), h('span', null, '가상의 앱')),
        h('div', {class:'app-body'},
          h('div', {class:'queue'}, h('span', null, c.venue), h('span', null, c.prefix, bold)),
          h('h3', null, c.title),
          ul, err,
          h('button', {class:'btn-app', type:'button', onclick:function(){ submit(true); }}, c.all),
          pressure,
          h('button', {class:'btn-link', type:'button', onclick:function(){ submit(false); }}, c.some)
        )
      ));
      var iv = setInterval(function(){
        n++;
        var out = c.tick(n);
        if (out.bold) bold.textContent = out.bold;
        pressure.textContent = out.msg;
      }, 3500);
      timers.push(iv);
    });
  }

  /* ---------- 2-2. 열린 문 ---------- */
  function sGate(r){
    var c = who().gate;
    hud(2, '2장 · 동의');
    holders(1);
    var sec = S.consentMs == null ? '–' : (S.consentMs / 1000).toFixed(1);
    add(r, chip(S.doneChip || '완료'));
    add(r, h('h2', {class:'h2'}, '방금, 문이 열렸습니다'));
    add(r, h('p', {class:'stat'}, '동의까지 ' + sec + '초 · 약관은 ' + (S.readTerms ? '펼쳐 봤습니다' : '펼쳐 보지 않았습니다')));
    if (S.optional === 0){
      add(r, narr(c.none));
      add(r, narr(GATE_NONE2));
    } else {
      add(r, narr(c.all));
    }
    add(r, h('div', {class:'flow', 'aria-label':'기록이 넘어가는 경로'},
      h('div', {class:'flow-lab'}, '보내는 곳'),
      h('div', {class:'flow-out'}, ['병원', '약국', '건강보험공단', '심사평가원', '유전자검사기관'].map(function(t){ return h('span', null, t); })),
      h('div', {class:'flow-lab'}, '넘어가는 기록'),
      h('div', {class:'flow-chips'}, c.chips.map(function(t){ return h('span', null, t); })),
      h('div', {class:'flow-arrow'}, '↓ 정기 전송'),
      h('div', {class:'flow-gate'}, '관리전문기관'),
      h('div', {class:'flow-arrow'}, '↓'),
      h('div', {class:'flow-out'}, h('span', null, '의료플랫폼'), h('span', null, '보험사'), h('span', null, '제약회사')),
      info(c.tip)
    ));
    step(r, '기록이 흘러간 곳 따라가기', next);
  }

  /* ---------- 3. 세 개의 앱 ---------- */
  function sCh3(r){
    hud(3, '3장 · 세 화면');
    add(r, chip('그날 이후'));
    add(r, h('h2', {class:'h2'}, '내 기록이 도착한 곳'));
    var guide = h('p', {class:'note', role:'status'}, '아이콘을 눌러 화면을 열어 보세요. 0/3');
    add(r, guide);
    var seen = [false, false, false], nextShown = false;
    var apps = [
      ['의료플랫폼', '#2f6bff', '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'],
      ['보험사', '#12907f', '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>'],
      ['제약회사', '#5b4fd6', '<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>']
    ];
    var box = h('div');
    var btns = apps.map(function(a, k){
      return h('button', {class:'icon', type:'button', 'aria-pressed':'false', style:'--brand:' + a[1], onclick:function(){ open(k); }}, h('i', {html:a[2], 'aria-hidden':'true'}), a[0]);
    });
    add(r, h('div', {class:'dock'}, btns));
    add(r, box);

    function open(k){
      btns.forEach(function(b, n){ b.setAttribute('aria-pressed', n === k ? 'true' : 'false'); });
      if (!seen[k]){ seen[k] = true; btns[k].classList.add('seen'); holders(1 + seen.filter(Boolean).length); }
      box.innerHTML = '';
      add(box, [p1, p2, p3][k]());
      var n = seen.filter(Boolean).length;
      guide.textContent = n < 3 ? '아이콘을 눌러 화면을 열어 보세요. ' + n + '/3' : '세 화면을 모두 확인했습니다.';
      if (n === 3 && !nextShown){ nextShown = true; step(r, '이듬해로', next); }
    }
    function shell(k, name, body){
      return h('div', {class:'app', style:'--brand:' + apps[k][1]},
        h('div', {class:'app-bar'}, h('b', null, name), h('span', null, '가상의 화면')),
        h('div', {class:'app-body'}, body));
    }

    function p1(){
      var c = who().platform;
      return h('div', {class:'below'},
        h('p', {class:'lead'}, c.lead),
        shell(0, c.name, [
          h('div', {class:'stats'}, c.stats.map(function(x){ return h('span', null, h('b', null, x[0]), x[1]); })),
          h('h3', null, c.heading),
          h('ul', {class:'ads'}, c.ads.map(function(x){ return h('li', null, h('small', null, x[0]), x[1]); }))
        ]),
        factI('흩어져 있던 기록이 한 기업에 모이면 <b>광고판</b>이 됩니다.',
          '<p>진료 예약 앱, 비대면진료 앱, 건강 기기 회사 같은 민간 기업도 관리전문기관이 될 수 있습니다(제20조).</p><p>진단명이나 추정된 질병 위험에 기반한 광고는 금지되지만(제4조제2항제3호), 이 법에는 어겼을 때의 제재 조항이 없습니다(제36조, 제38조).</p><p>금지 대상도 이 법에 따라 제공받은 정보뿐이어서, 기업이 자기 서비스에서 직접 쌓은 정보에는 미치지 않습니다.</p><p class="eg-t">화면과 광고 문구는 가상 예시입니다.</p>')
      );
    }

    function p2(){
      var ci = who().insurer;
      var recs = ci.recs;
      var rows = [['A', '가입 가능 · 표준 보험료'], ['B', '보험료 할증'], ['C', '보험료 할증 · 일부 보장 제외'], ['D', ci.worst]];
      var n = 0;
      var letter = h('div', {class:'grade-letter', 'data-g':'A'}, 'A');
      var verdict = h('dd', null, rows[0][1]);
      var list = h('ul', {class:'recs'}, h('li', {class:'none'}, '아직 불러온 기록이 없습니다'));
      var after = h('div', {class:'below'});
      var load = h('button', {class:'btn-app', type:'button', onclick:function(){
        if (n === 0) list.innerHTML = '';
        add(list, h('li', null, recs[n] + ' 불러옴'));
        n++;
        letter.textContent = rows[n][0]; letter.setAttribute('data-g', rows[n][0]);
        verdict.textContent = rows[n][1]; verdict.className = 'bad';
        if (n < recs.length) { load.textContent = recs[n] + ' 불러오기'; return; }
        load.remove();
        add(after, factI('이 법이 금지한 활용입니다. 그러나 <b>이 법에는 어겼을 때의 제재 조항이 없습니다.</b>',
          '<p>보험 가입 거절, 보험료와 대출금리의 차등, 인사 결정에 의료정보를 쓰는 것은 금지됩니다(제4조제2항제2호).</p><p>그러나 이 금지를 어겨도 벌칙, 과태료, 시정조치 어느 조항에도 해당하지 않습니다(제32조, 제36조, 제38조).</p><p>관리전문기관의 결격사유 규정이 없어, 보험회사나 금융회사가 지정받는 것도 막지 못합니다(제20조).</p>' + PIPA_NOTE + '<p class="eg-t">화면, 등급, 결과는 가상 예시입니다.</p>'));
        add(after, h('p', {class:'lead'}, '같은 등급은 채용 심사나 입주 심사 같은 다른 곳으로도 흘러갈 수 있습니다. 등급을 매기는 잣대는 세 번째 화면에서 만들어집니다.'));
      }}, recs[0] + ' 불러오기');
      return h('div', {class:'below'},
        h('p', {class:'lead'}, ci.lead),
        shell(1, '새봄생명 가입 심사', [
          h('div', {class:'stats'}, ci.stats.map(function(x){ return h('span', null, h('b', null, x[0]), x[1]); })),
          h('div', {class:'card'}, h('h4', null, '관리전문기관에서 불러온 기록'), list, load),
          h('div', {class:'card'},
            h('h4', null, '심사 결과'),
            h('div', {class:'grade', role:'status'}, letter, h('dl', null, h('dt', null, '판정'), verdict)))
        ]),
        after
      );
    }

    function p3(){
      var steps = [['1명', 2], ['1,000명', 30], ['10만 명', 65], ['500만 명', 100]];
      var k = 0, tries = 0;
      var count = h('b', null, steps[0][0]);
      var bar = h('i', {style:'width:2%'});
      var modelBox = h('div', {class:'below'});
      var after = h('div', {class:'below'});
      var gather = h('button', {class:'btn-app', type:'button', onclick:function(){
        k++; count.textContent = steps[k][0]; bar.style.width = steps[k][1] + '%';
        if (k === steps.length - 1){ gather.remove(); model(); }
      }}, '더 모으기');
      function model(){
        var g = h('div', {class:'grade-letter', 'data-g':'A'}, '?');
        var calc = h('button', {class:'btn-app', type:'button', onclick:function(){
          calc.remove();
          g.textContent = 'D'; g.setAttribute('data-g', 'D');
          add(after, factI('이름을 지워도, 모이면 <b>모든 사람에게 등급을 매기는 잣대</b>가 됩니다.',
            '<p>2차활용 지원기관이 요청하면 의료기관 같은 정보보유기관은 기록을 가명처리해 내줘야 합니다(제13조제5항). 건강보험공단과 심사평가원은 복지부 장관이 요청하면 특별한 사유가 없는 한 따라야 합니다(제10조제2항). 어느 단계에도 본인 동의는 필요 없습니다.</p><p>정신질환·유전질환 정보는 동의가 원칙이지만, 기관장이 위원을 위촉하는 기관 심의위원회가 승인하면 동의 없이 쓸 수 있습니다(제15조제2항 단서, 제17조제2항).</p><p>개인이나 집단에 불리한 결정을 내리는 활용은 금지되지만(제4조제2항) 이 법에는 제재 조항이 없고, 가명 기록의 활용 목적은 대통령령에 맡겼습니다(제13조제1항).</p><p class="eg-t">화면, 수치, 등급은 가상 예시입니다.</p>'));
          add(after, h('div', {class:'optout'}, h('span', null, '내 기록은 빼 주세요'), sw));
          add(after, msg);
        }}, '한 사람의 이력 넣기');
        add(modelBox, h('div', {class:'card'},
          h('h4', null, '위험 예측 모델 · 학습 완료'),
          h('div', {class:'grade', role:'status'}, g,
            h('dl', null, h('dt', null, '입력'), h('dd', null, who().model))),
          calc));
      }
      var msg = h('p', {class:'dead', role:'status', hidden:true});
      var sw = h('button', {class:'switch', type:'button', role:'switch', 'aria-checked':'false', 'aria-label':'내 기록은 빼 주세요', onclick:function(){
        if (sw.getAttribute('aria-checked') === 'true') return;
        sw.setAttribute('aria-checked', 'true');
        later(function(){
          sw.setAttribute('aria-checked', 'false');
          sw.classList.remove('snap'); void sw.offsetWidth; sw.classList.add('snap');
          tries++;
          msg.hidden = false;
          msg.textContent = tries === 1 ? '거부 신청을 받을 창구가 없습니다.' : '정부대안에는 거부할 권리(옵트아웃)를 정한 조문이 없습니다.';
        }, 650);
      }});
      return h('div', {class:'below'},
        h('p', {class:'lead'}, '제약회사 연구팀의 화면입니다. 이름을 지운 가명 기록을 받아 모읍니다. 직접 모아 보세요.'),
        shell(2, '한울제약 데이터랩', [
          h('div', {class:'card'},
            h('h4', null, '가명 진료기록 데이터셋'),
            h('p', {class:'pool-n'}, h('span', null, '모인 기록'), count),
            h('div', {class:'meter', 'aria-hidden':'true'}, bar),
            gather),
          modelBox
        ]),
        after
      );
    }
  }

  /* ---------- 4. 유출 ---------- */
  function sCh4(r){
    hud(4, '4장 · 유출');
    add(r, chip('시행 2년째 · 가상 상황'));
    add(r, h('div', {class:'alert', role:'alert'},
      h('div', {class:'alert-head'}, h('span', null, '긴급 안내'), h('span', null, '06:12')),
      '민간 의료 마이데이터 관리전문기관 서버가 해킹되었습니다. 가입자의 진료, 처방, 유전 정보가 다크웹에 유출되었습니다.'));
    S.leaked = true; drawHolders();
    add(r, narr('유출된 내 정보 목록입니다. 바꿀 수 있는 것부터 바꿔 보세요.'));
    var data = [
      ['앱 비밀번호', '바꾸기', true, '변경 완료'],
      ['카드 번호', '재발급', true, '재발급 완료'],
      [who().leaks[0], '바꾸기', false, '바꿀 수 없음'],
      [who().leaks[1], '바꾸기', false, '바꿀 수 없음'],
      ['유전정보', '바꾸기', false, '바꿀 수 없음 · 가족도 함께 노출']
    ];
    var left = data.length;
    var ul = h('ul', {class:'leaks'});
    data.forEach(function(d){
      var li = h('li', null, h('span', null, d[0]));
      var b = h('button', {class:'btn small', type:'button', onclick:function(){
        b.remove();
        li.append(h('span', {class:'res ' + (d[2] ? 'ok' : 'no')}, d[3]));
        if (!d[2]) li.classList.add('shake');
        if (--left === 0) after();
      }}, d[1]);
      li.append(b); ul.append(li);
    });
    add(r, ul);
    function after(){
      add(r, narr('비밀번호와 카드는 새로 받으면 됩니다. 병력과 유전정보는 <strong>평생 바꿀 수 없습니다.</strong>'));
      step(r, '유전정보가 닿는 범위 보기', family);
    }
    function family(){
      var ck = who().kin;
      var kin = ck.rows;
      var bars = [];
      var ul = h('ul', {class:'kin'}, kin.map(function(k){
        var bar = h('i', {style:'width:0'}); bars.push([bar, k[2]]);
        return h('li', {class:k[3] ? 'src' : null}, h('span', null, k[0]), h('div', {class:'meter', 'aria-hidden':'true'}, bar), h('b', null, k[1]));
      }));
      add(r, h('div', {class:'panel'},
        h('h3', null, '한 사람의 유전정보는 가족 모두의 정보'),
        h('p', null, ck.intro),
        ul,
        factI(ck.fact,
          '<p>막대는 같은 조상에게서 물려받아 ' + ck.whose + ' 공유하는 유전정보의 비율입니다. 부모와 자녀는 절반이고, 나머지 관계는 평균값입니다.</p><p>가족 한 사람이 누구인지 알려지면, 가명처리된 다른 가족의 기록도 누구 것인지 좁혀 갈 수 있습니다.</p><p>정부대안에는 유전정보의 정의가 없고(제2조), 가족에게 동의나 거부를 묻는 조항도 없습니다. 유전질환 정보는 기관 심의위원회가 승인하면 본인 동의 없이도 쓸 수 있습니다(제15조제2항 단서).</p>')
      ));
      later(function(){ bars.forEach(function(b){ b[0].style.width = b[1] + '%'; }); }, 120);
      step(r, '기업에 배상 요구하기', function(){
        add(r, h('p', {class:'dead'}, '회사 답변: 법이 정한 보호조치를 모두 이행했으므로 과실이 없고, 배상 책임도 없다고 판단합니다. 이의가 있으시면 소송으로 다투시기 바랍니다.'));
        later(function(){
          add(r, factI('집단소송 제도는 없습니다. 피해자는 <b>각자 소송해야 합니다.</b>',
            '<p>개인정보 보호법에는 손해배상(제39조)과 300만 원 이하의 법정손해배상(제39조의2) 규정이 있고, 과실이 없다는 점은 기업이 입증해야 합니다.</p><p>그러나 배상을 받으려면 피해자가 각자 소송을 내야 합니다. 단체소송(제51조)으로는 침해 행위의 중지만 청구할 수 있고, 배상은 청구할 수 없습니다.</p><p>2008년 옥션 해킹 사건에서 대법원은 회사가 법령이 정한 보호조치를 다했다고 보아 배상 책임을 인정하지 않았습니다(2015년 선고).</p><p>정부대안은 관리전문기관에 손해배상책임 이행을 위한 보험이나 공제 가입 등을 요구할 뿐(제20조제5항), 집단소송은 두지 않았습니다.</p>'));
          step(r, '이 규칙은 누가 정했을까', next);
        }, 800);
      }, '');
    }
  }

  /* ---------- 5. 판결 ---------- */
  var QS = [
    { t:'기업이 내 진료·처방 기록을 광고나 차별에 쓰면 엄격히 처벌해야 한다.',
      gov:'금지는 합니다. 그러나 이 법에는 어겼을 때의 제재 조항이 없습니다.',
      tip:'<p>차별적 결정, 고용·보험·신용 차등, 질병 위험에 기반한 광고를 금지합니다(제4조제2항).</p><p>그러나 이 금지를 어긴 행위는 벌칙(제36조), 과태료(제38조), 시정조치(제32조) 어디에도 들어 있지 않습니다.</p><p>처벌되는 차별은 관리전문기관이 정신질환자, 장애인 등을 차별한 경우 하나뿐입니다(제20조제4항제3호).</p>' + PIPA_NOTE },
    { t:'내 의료정보를 기업 연구에 쓰지 말라고 거부할 수 있어야 한다.',
      gov:'거부할 권리(옵트아웃)를 정한 조문이 없습니다.',
      tip:'<p>가명처리한 기록은 본인 동의 없이 제공됩니다(제13조제5항, 제15조제1항).</p><p>그 어느 단계에도 거부권을 정한 조문이 없습니다.</p>' },
    { t:'보험사와 금융사는 내 의료기록을 모으는 관리전문기관이 될 수 없어야 한다.',
      gov:'결격사유 규정이 없습니다.',
      tip:'<p>보험회사나 금융회사가 지정받는 것을 막는 규정이 없습니다.</p><p>장관이 사업계획의 목적 부합을 요건으로 삼거나 조건을 붙일 수 있지만 의무가 아니고, 세부 기준은 개인정보 보호법을 준용합니다(제20조제1항·제3항).</p>' }
  ];
  function sCh5(r){
    hud(5, '5장 · 판결');
    S.votes = [];
    add(r, chip('다시 오늘'));
    add(r, h('h2', {class:'h2'}, '시민의 판결'));
    add(r, narr('지금까지는 가정입니다. 법은 아직 통과되지 않았고, 정부대안은 국회 보건복지위원회에서 심사 중입니다. 규칙을 당신이 먼저 정한 뒤 법안과 견주어 보세요.'));
    ask(0);
    function ask(k){
      var q = QS[k];
      var ans = h('div');
      var b1 = h('button', {class:'btn', type:'button'}, '그래야 한다');
      var b2 = h('button', {class:'btn', type:'button'}, '그럴 필요 없다');
      function pick(v, b){
        b1.disabled = b2.disabled = true; b.classList.add('picked');
        S.votes[k] = v;
        add(ans, h('div', {class:'q-a'},
          h('p', {class:'gov'}, h('span', {class:'lab'}, '정부대안'), q.gov, ' ', info(q.tip))));
        if (k < QS.length - 1) step(r, '다음 질문', function(){ ask(k + 1); });
        else {
          var yes = S.votes.filter(Boolean).length;
          add(r, narr(yes ? '당신이 요구한 안전장치 ' + yes + '개 가운데 정부안에 담긴 것은 <strong>0개</strong>입니다.' : '세 가지 모두 필요 없다고 판결했습니다. 정부대안의 답도 크게 다르지 않습니다.'));
          step(r, '체험 기록 보기', next);
        }
      }
      b1.addEventListener('click', function(){ pick(true, b1); });
      b2.addEventListener('click', function(){ pick(false, b2); });
      add(r, h('div', {class:'q'},
        h('p', {class:'q-n'}, '질문 ' + (k + 1) + ' / ' + QS.length),
        h('p', {class:'q-t'}, q.t),
        h('div', {class:'row'}, b1, b2),
        ans));
    }
  }

  /* ---------- 결말 ---------- */
  function sEnd(r){
    hud(5, '체험 기록');
    var sec = S.consentMs == null ? '–' : (S.consentMs / 1000).toFixed(1) + '초';
    var yes = S.votes.filter(Boolean).length;
    var line1 = who().end + '을 넘기는 데 걸린 시간, ' + sec + '.';
    var line2 = yes
      ? '내가 요구한 안전장치 ' + yes + '개 중 정부안에 담긴 것, 0개.'
      : '정부안에는 거부권도, 금지를 어겼을 때의 제재도, 결격사유도 없습니다.';
    add(r, h('p', {class:'big'}, line1));
    add(r, h('p', {class:'big zero'}, line2));
    add(r, h('div', {class:'result'},
      h('h3', null, '나의 체험 기록', h('span', null, 'No. 0012')),
      h('dl', null,
        h('dt', null, '동의까지 걸린 시간'), h('dd', null, sec),
        h('dt', null, '약관'), h('dd', null, S.readTerms ? '펼쳐 봄' : '펼쳐 보지 않음'),
        h('dt', null, '동의 범위'), h('dd', null, S.optional === 0 ? '필수만' : (S.agreedAll ? '전체 동의' : '일부 선택')),
        h('dt', null, '내 기록을 가져간 곳'), h('dd', {class:'bad'}, S.holders + '곳 + 유출'),
        h('dt', null, '내가 요구한 안전장치'), h('dd', null, yes + '개'),
        h('dt', null, '그중 정부안에 담긴 것'), h('dd', {class:'bad'}, '0개')
      )));
    add(r, narr('<strong>병원을 사기업에 팔아야만 민영화가 아닙니다.</strong> 나와 가족의 기록이 영리 기업의 서버로 넘어가고, 기업은 그 데이터로 돈을 벌며 우리 몸에 등급을 매길 수 있게 됩니다.'));
    add(r, note('디지털헬스케어법 정부대안은 2026년 9월 국회에 제출되어 보건복지위원회 법안심사소위원회에서 심사 중입니다.'));
    var hint = h('p', {class:'note', role:'status'});
    var cta = SIGN_URL
      ? h('a', {class:'btn cta', href:SIGN_URL, target:'_blank', rel:'noopener'}, '국회 보건복지위원회에 반대 서명하기')
      : h('button', {class:'btn cta', type:'button', onclick:function(){ hint.textContent = '서명 페이지 주소를 연결하면 이 버튼이 그곳으로 이동합니다.'; }}, '국회 보건복지위원회에 반대 서명하기');
    var share = '당신의 의료정보는 안전한가요?\n디지털헬스케어법, 4분 체험으로 확인해 보세요.\n👉 ' + SHARE_URL;
    add(r, h('div', {class:'row'}, cta));
    add(r, h('div', {class:'tell'},
      h('h3', null, '이 체험 링크 알리기'),
      h('p', {class:'tell-text'}, share),
      h('button', {class:'btn', type:'button', onclick:function(){
        var done = function(){ hint.textContent = '복사했습니다.'; };
        var fail = function(){ hint.textContent = '복사하지 못했습니다. 위 문구를 길게 눌러 직접 복사해 주세요.'; };
        try { navigator.clipboard.writeText(share).then(done, fail); } catch (e) { fail(); }
      }}, '링크 복사하기'),
      hint));
    add(r, h('div', {class:'row'},
      h('button', {class:'btn', type:'button', onclick:function(){
        S = { i:0, who:null, consentMs:null, readTerms:false, agreedAll:null, optional:null, holders:0, leaked:false, votes:[] };
        go(0);
      }}, '처음부터 다시')));
  }

  var scenes = [sTitle, sCh1, sRewind, sCh2, sGate, sCh3, sCh4, sCh5, sEnd];

  function start(data){
    if (data && typeof data.i === 'number' && data.i >= 0 && data.i < scenes.length){
      for (var k in data) S[k] = data[k];
    }
    go(S.i);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function(){ return S; }); } catch (e) {} }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
